<style>
.busa-l1{
  --l1-ground:#ffffff; --l1-surface:#f4f6f8; --l1-line:#e4e8ed;
  --l1-ink:#15181d; --l1-ink2:#5b636f; --l1-ink3:#8b939f;
  --l1-club:#15181d; --l1-club-rgb:21,24,29;
  --l1-crest-bg:none; --l1-crest-pad:0;

  max-width:640px; margin:0 auto; background:var(--l1-ground); color:var(--l1-ink);
  border:1px solid var(--l1-line); border-radius:14px; overflow:hidden;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,
    "Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.45; text-align:left;
  -webkit-font-smoothing:antialiased;
}
.busa-l1 *,.busa-l1 *::before,.busa-l1 *::after{box-sizing:border-box;}
.busa-l1 p,.busa-l1 h2,.busa-l1 h3,.busa-l1 ol,.busa-l1 li{margin:0;padding:0;}
.busa-l1 ol{list-style:none;}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .busa-l1:not([data-busa-theme="light"]){
    --l1-ground:#101317; --l1-surface:#191d23; --l1-line:#272c34;
    --l1-ink:#e9ecf0; --l1-ink2:#9ba3af; --l1-ink3:#6e7683;
    --l1-crest-bg:#eef1f5; --l1-crest-pad:.26rem;
  }
}
:root[data-theme="dark"] .busa-l1:not([data-busa-theme="light"]){
  --l1-ground:#101317; --l1-surface:#191d23; --l1-line:#272c34;
  --l1-ink:#e9ecf0; --l1-ink2:#9ba3af; --l1-ink3:#6e7683;
  --l1-crest-bg:#eef1f5; --l1-crest-pad:.26rem;
}

.busa-l1 .l1-head{
  display:flex; flex-wrap:wrap; gap:.75rem 1rem; align-items:flex-end;
  justify-content:space-between; padding:.95rem 1rem .85rem;
  border-bottom:1px solid var(--l1-line);
}
.busa-l1 .l1-id{display:flex; align-items:center; gap:.65rem; min-width:0;}
.busa-l1 .l1-idtxt{min-width:0;}
.busa-l1 .l1-eyebrow{
  font-size:.62rem; font-weight:600; letter-spacing:.13em; text-transform:uppercase;
  color:var(--l1-ink3);
}
.busa-l1 .l1-season{
  font-size:1.1rem; font-weight:650; letter-spacing:-.015em; line-height:1.2;
  color:var(--l1-ink);
}
.busa-l1 .l1-crest{
  flex:none; display:grid; place-items:center;
  width:2.4rem; height:2.4rem; border-radius:50%;
  background:rgba(var(--l1-club-rgb),.11);
  box-shadow:inset 0 0 0 1px rgba(var(--l1-club-rgb),.22);
  font-size:.58rem; font-weight:750; color:var(--l1-club); overflow:hidden;
}
.busa-l1 .l1-crest img{width:100%; height:100%; object-fit:contain; display:block;}
.busa-l1 .l1-crest.has-logo{
  background:var(--l1-crest-bg,none); box-shadow:none; padding:var(--l1-crest-pad,0);
}
.busa-l1 .l1-crest.has-logo.chip-dark{background:#15181d; padding:.26rem;}

.busa-l1 .l1-pick{position:relative; display:block;}
.busa-l1 .l1-pick::after{
  content:""; position:absolute; right:.7rem; top:50%; width:.42rem; height:.42rem;
  border-right:1.6px solid var(--l1-ink2); border-bottom:1.6px solid var(--l1-ink2);
  transform:translateY(-70%) rotate(45deg); pointer-events:none;
}
.busa-l1 select{
  -webkit-appearance:none; appearance:none;
  font:inherit; font-size:.875rem; font-weight:550; color:var(--l1-ink);
  background:var(--l1-surface); border:1px solid var(--l1-line); border-radius:9px;
  padding:.42rem 1.9rem .42rem .7rem; min-width:12.5rem; max-width:100%; cursor:pointer;
}
.busa-l1 select:focus-visible{outline:2px solid var(--l1-club); outline-offset:2px;}

.busa-l1 .l1-filters{
  display:grid; grid-template-columns:repeat(3,1fr); gap:.3rem;
  padding:.6rem 1rem; border-bottom:1px solid var(--l1-line);
}
.busa-l1 .l1-filters button{
  display:flex; align-items:baseline; justify-content:center; gap:.4rem;
  font:inherit; font-size:.78rem; color:var(--l1-ink2);
  background:transparent; border:1px solid transparent; border-radius:8px;
  padding:.34rem .3rem; cursor:pointer; transition:background .15s,color .15s;
}
.busa-l1 .l1-filters button:hover{background:var(--l1-surface);}
.busa-l1 .l1-filters button b{
  font-size:.78rem; font-weight:650; font-variant-numeric:tabular-nums;
  color:var(--l1-ink);
}
.busa-l1 .l1-filters button[aria-pressed="true"]{
  background:rgba(var(--l1-club-rgb),.1); color:var(--l1-club);
  border-color:rgba(var(--l1-club-rgb),.22);
}
.busa-l1 .l1-filters button[aria-pressed="true"] b{color:var(--l1-club);}
.busa-l1 .l1-filters button:focus-visible{outline:2px solid var(--l1-club); outline-offset:1px;}

.busa-l1 .l1-list{
  max-height:min(60vh,32rem); overflow-y:auto; overscroll-behavior:contain;
  scrollbar-width:thin; scrollbar-color:var(--l1-line) transparent;
}
.busa-l1 .l1-list::-webkit-scrollbar{width:8px;}
.busa-l1 .l1-list::-webkit-scrollbar-thumb{background:var(--l1-line); border-radius:4px;}
.busa-l1 .l1-month{
  position:sticky; top:0; z-index:1; background:var(--l1-ground);
  padding:.7rem 1rem .3rem;
}
.busa-l1 .l1-month h3{
  font-size:.66rem; font-weight:650; letter-spacing:.12em; text-transform:uppercase;
  color:var(--l1-ink3);
}
.busa-l1 .l1-g{
  display:grid; grid-template-columns:2rem 1.35rem 1fr auto;
  align-items:center; gap:.55rem;
  padding:.42rem 1rem; border-top:1px solid var(--l1-line);
}
.busa-l1 .l1-month + .l1-g{border-top:0;}
.busa-l1 .l1-j{
  font-size:.72rem; font-weight:650; color:var(--l1-ink3);
  font-variant-numeric:tabular-nums;
}
.busa-l1 .l1-ico{font-size:.82rem; line-height:1; text-align:center;}
.busa-l1 .l1-opp{
  display:flex; align-items:baseline; gap:.35rem; min-width:0;
  font-size:.875rem; font-weight:500; color:var(--l1-ink);
}
.busa-l1 .l1-name{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.busa-l1 .l1-short{display:none;}
.busa-l1 .l1-date{
  font-size:.78rem; color:var(--l1-ink2); font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.busa-l1 .l1-g.is-home{background:rgba(var(--l1-club-rgb),.045);}
.busa-l1 .l1-g.is-past{opacity:.42;}
.busa-l1 .l1-g.is-next .l1-j{color:var(--l1-club);}
.busa-l1 .l1-g.is-next .l1-date{color:var(--l1-club); font-weight:650;}
.busa-l1 .l1-empty{padding:2rem 1rem; text-align:center; color:var(--l1-ink3); font-size:.85rem;}

.busa-l1 .l1-note{
  padding:.65rem 1rem .75rem; border-top:1px solid var(--l1-line);
  background:var(--l1-surface);
  font-size:.7rem; line-height:1.5; color:var(--l1-ink3);
}
.busa-l1 .l1-note b{color:var(--l1-ink2); font-weight:600;}
.busa-l1 .l1-sr{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}

@media (max-width:430px){
  .busa-l1 .l1-filters button .l1-lbl{display:none;}
  .busa-l1 .l1-g{grid-template-columns:1.8rem 1.2rem 1fr auto; gap:.4rem;}
  .busa-l1 .l1-full{display:none;}
  .busa-l1 .l1-short{display:inline;}
  .busa-l1 .l1-date{font-size:.74rem;}
}
@media (prefers-reduced-motion:reduce){ .busa-l1 *{transition:none !important;} }
</style>

  var EPOCH=Date.UTC(2026,7,1), DAY=864e5;
  var JOURS=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
  var MOIS=['janvier','février','mars','avril','mai','juin','juillet',
            'août','septembre','octobre','novembre','décembre'];
  // abreviations françaises usuelles (mars, mai, juin, août ne s'abregent pas)
  var MOIS_AB=['janv.','févr.','mars','avr.','mai','juin','juil.',
               'août','sept.','oct.','nov.','déc.'];

  var root=document.getElementById('busaL1');
  var sel=document.getElementById('l1Club');
  var list=document.getElementById('l1List');
  var btns=root.querySelectorAll('.l1-filters button');
  var filtre='all', courant='PSG';

  var now=new Date();
  var jourJ=Math.round((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-EPOCH)/DAY);

  CLUBS.forEach(function(c){
    var o=document.createElement('option');
    o.value=c[0]; o.textContent=c[1]; sel.appendChild(o);
  });

  function idx(code){
    for(var i=0;i<CLUBS.length;i++){ if(CLUBS[i][0]===code) return i; }
    return 0;
  }

  function sombre(){
    var de=document.documentElement;
    if(root.getAttribute('data-busa-theme')==='light') return false;
    if(de.getAttribute('data-theme')==='dark') return true;
    if(de.getAttribute('data-theme')==='light') return false;
    return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function peindre(){
    var c=CLUBS[idx(courant)], d=sombre();
    root.style.setProperty('--l1-club', d?c[5]:c[3]);
    root.style.setProperty('--l1-club-rgb', d?c[6]:c[4]);
  }

  function ecusson(){
    var c=CLUBS[idx(courant)], el=document.getElementById('l1Crest');
    el.className='l1-crest';
    if(c[7]){
      var img=new Image();
      img.alt=''; img.loading='lazy'; img.decoding='async';
      img.onerror=function(){ el.className='l1-crest'; el.textContent=c[0]; };
      img.src=c[7];
      el.textContent='';
      el.className='l1-crest has-logo'+(c[8]?' chip-dark':'');
      el.appendChild(img);
    } else {
      el.textContent=c[0];
    }
  }

  function rendre(){
    var matchs=SCHED[courant]||[];
    var nh=0,na=0;
    matchs.forEach(function(g){ g[1]?na++:nh++; });
    document.getElementById('l1Na').textContent=matchs.length;
    document.getElementById('l1Nh').textContent=nh;
    document.getElementById('l1Ne').textContent=na;
    document.getElementById('l1Name').textContent=CLUBS[idx(courant)][1];

    var vus=matchs.filter(function(g){
      return filtre==='all' || (filtre==='home')===!g[1];
    });
    if(!vus.length){ list.innerHTML='<p class="l1-empty">Aucun match.</p>'; return; }

    var suivant=-1;
    for(var i=0;i<vus.length;i++){ if(vus[i][3]>=jourJ){ suivant=i; break; } }

    var html='', moisCourant=-1;
    vus.forEach(function(g,i){
      var d=new Date(EPOCH+g[3]*DAY), mo=d.getUTCMonth();
      if(mo!==moisCourant){
        moisCourant=mo;
        var lbl=MOIS[mo].charAt(0).toUpperCase()+MOIS[mo].slice(1);
        html+='<div class="l1-month"><h3>'+lbl+' '+d.getUTCFullYear()+'</h3></div>';
      }
      var ext=!!g[1], adv=CLUBS[g[0]];
      var jj=d.getUTCDate();
      var iso=d.getUTCFullYear()+'-'+(mo+1<10?'0':'')+(mo+1)+'-'+(jj<10?'0':'')+jj;
      var cls='l1-g'+(ext?'':' is-home')
             +(g[3]<jourJ?' is-past':'')+(i===suivant?' is-next':'');
      html+='<li class="'+cls+'">'
          + '<span class="l1-j">J'+g[2]+'</span>'
          + '<span class="l1-ico" aria-hidden="true">'+(ext?'✈️':'🏠')+'</span>'
          + '<span class="l1-opp"><span class="l1-sr">'
          +   (ext?'À l’extérieur chez ':'À domicile contre ')+'</span>'
          +   '<span class="l1-name l1-full">'+adv[1]+'</span>'
          +   '<span class="l1-name l1-short">'+adv[2]+'</span></span>'
          + '<time class="l1-date" datetime="'+iso+'">'
          +   JOURS[d.getUTCDay()]+' '+(jj===1?'1er':jj)+' '+MOIS_AB[mo]+'</time>'
          + '</li>';
    });
    list.innerHTML='<ol>'+html+'</ol>';
  }

  function choisir(code,pousser){
    if(!SCHED[code]) return;
    courant=code; sel.value=code; peindre(); ecusson(); rendre();
    if(pousser && history.replaceState) history.replaceState(null,'','#'+code);
  }

  sel.addEventListener('change',function(){ choisir(sel.value,true); list.scrollTop=0; });

  Array.prototype.forEach.call(btns,function(b){
    b.addEventListener('click',function(){
      filtre=b.getAttribute('data-f');
      Array.prototype.forEach.call(btns,function(x){
        x.setAttribute('aria-pressed', x===b?'true':'false');
      });
      rendre(); list.scrollTop=0;
    });
  });

  if(window.matchMedia){
    var mq=window.matchMedia('(prefers-color-scheme: dark)');
    (mq.addEventListener?mq.addEventListener.bind(mq,'change'):mq.addListener.bind(mq))(peindre);
  }

  function voulu(){
    var m=(location.search||'').match(/[?&]club=([A-Za-z]{2,4})/);
    var c=(m?m[1]:(location.hash||'').replace('#','')).toUpperCase();
    return SCHED[c]?c:'PSG';
  }
  choisir(voulu(),false);
  window.addEventListener('hashchange',function(){
    var h=(location.hash||'').replace('#','').toUpperCase();
    if(SCHED[h]) choisir(h,false);
  });
})();
